<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AR Admin</title>
    <meta name="description" content="Atelier Rembrandt — Collectiebeheer CMS" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA theme color — dark to match admin UI -->
    <meta name="theme-color" content="#1C1A18" />

    <!-- iOS PWA — these are critical for "Add to Home Screen" to work correctly -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AR Admin" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/andor.jpeg" />
    <link rel="apple-touch-startup-image" href="/images/andor.jpeg" />

    <!-- Admin PWA Manifest — STATIC link so iOS reads it before JS runs -->
    <link rel="manifest" href="/admin-manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/images/andor.jpeg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0;padding:0;background:#1C1A18;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
