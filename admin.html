<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AR Admin</title>
    <meta name="description" content="Atelier Rembrandt — Collectiebeheer CMS" />
    <meta name="robots" content="noindex, nofollow" />

    <meta name="theme-color" content="#FAFAFA" />

    <!-- iOS PWA — these are critical for "Add to Home Screen" to work correctly -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AR Admin" />
    <link rel="apple-touch-icon" href="/AR.png" />
    <link rel="apple-touch-startup-image" href="/AR.png" />

    <!-- Admin PWA Manifest — STATIC link so iOS reads it before JS runs -->
    <link rel="manifest" href="/admin-manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/AR.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0;padding:0;background:#FAFAFA;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
